# Lorenz63 Forecasting Configuration

# Dataset parameters
dataset:
  saved_data_dir: "${TNO_DATA_DIR}/Lorenz63/forecasting"
  dyn_sys_name: 'Lorenz63'
  T: 2.0
  T_in: 2.0  # Use same interval
  dt: 0.01  # Standard integration step
  compositions: 500  # Number of times to compose the flow map for statistics evaluation
  sample_rate: 0.01
  burn_in_time: 50.0  # Remove transients to ensure trajectory is on attractor
  prediction_horizon: 2.0  # Forecast 2.0 time units into the future
  input_inds: [0]          # x input only
  output_inds: [0]         # x output (forecast future x from current x)
  n_trajectories_train: 200000
  n_trajectories_val: 2000
  n_trajectories_test: 2000
  params:
    sigma: 10.0
    rho: 28.0
    beta: 2.667
    # Initial condition ranges: [x_min, x_max, y_min, y_max, z_min, z_max]
    init_ranges: [-15, 15, -15, 15, 0, 40]

# Model parameters
model:
  use_cross_attention: true  # Cross-attention decoder
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 128
  dropout: 0.1
  activation: 'gelu'
  use_positional_encoding: false
  append_position_to_x: true
  pos_enc_coeff: 2
  domain_dim: 1
  plot_inds: [0]  # Only one output dimension for L63 forecasting

# Training parameters
training:
  batch_size: 64
  learning_rate: 0.0001
  max_epochs: 1000
  monitor_metric: 'loss/train/rel_L2'
  lr_scheduler_params:
    patience: 2
    factor: 0.5
  gradient_clip_val: 10.0
  log_every_n_steps: 1
  loss_name: 'l2_rel'

# Experiment settings
experiment:
  project_name: 'L63_Forecasting'
  seed: 0

evaluation:
  checkpoint_path: null  # Set here or pass --checkpoint
  system_name: 'L63'
  n_examples: 5  # Number of example plots to generate
  save_plots: true
  seed: 42

# Data generation (scripts/generate_data.py); results can differ slightly between batch sizes
data_generation:
  batch_size: 50000
