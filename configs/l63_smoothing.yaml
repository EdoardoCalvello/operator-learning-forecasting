# Lorenz63 Smoothing Configuration

# Dataset parameters
dataset:
  saved_data_dir: "${TNO_DATA_DIR}/Lorenz63/smoothing"
  dyn_sys_name: 'Lorenz63'
  T: 5.0
  dt: 0.02  # Standard integration step
  sample_rate: 0.02
  burn_in_time: 20.0  # Remove transients to ensure trajectory is on attractor
  prediction_horizon: 0.0  # Smoothing (same time points)
  obs_noise_std: 0.0
  input_inds: [0]  # x coordinate as input
  output_inds: [1, 2]  # y,z coordinates as output
  n_trajectories_train: 10000
  n_trajectories_val: 1000
  n_trajectories_test: 1000
  params:
    sigma: 10.0
    rho: 28.0
    beta: 2.667
    # Initial condition ranges: [x_min, x_max, y_min, y_max, z_min, z_max]
    init_ranges: [-15, 15, -15, 15, 0, 40]

# Model parameters
model:
  use_transformer: true  # Self-attention encoder; zero horizon disables the decoder.
  d_model: 128
  nhead: 8
  num_layers: 6
  dim_feedforward: 128
  dropout: 0.001
  activation: 'gelu'
  use_positional_encoding: false
  append_position_to_x: true
  pos_enc_coeff: 2
  domain_dim: 1

# Training parameters
training:
  batch_size: 16
  learning_rate: 0.0001
  max_epochs: 1000
  max_time: "00:03:45:00"  # Training time limit (DD:HH:MM:SS) used for the paper runs
  monitor_metric: 'loss/val/rel_L2'
  lr_scheduler_params:
    patience: 10
    factor: 0.5
  gradient_clip_val: 10.0
  log_every_n_steps: 10
  loss_name: 'l2_rel'

# Experiment settings
experiment:
  project_name: 'L63_Smoothing'
  seed: 42

# Evaluation settings (optional - used when running evaluation script)
evaluation:
  checkpoint_path: null  # Set here or pass --checkpoint
  system_name: 'L63'
  n_examples: 5  # Number of example plots to generate
  save_plots: true
  seed: 42

# Data generation (scripts/generate_data.py); results can differ slightly between batch sizes
data_generation:
  batch_size: 50000
