# Lorenz96 Forecasting Configuration

# Dataset parameters
dataset:
  saved_data_dir: "${TNO_DATA_DIR}/Lorenz96/forecasting"
  dyn_sys_name: 'Lorenz96'
  T: 5.0
  dt: 0.02  # Standard integration step
  T_in: 5.0  # Use same interval
  compositions: 50  # Forecast compositions in the evaluation rollout
  sample_rate: 0.02
  burn_in_time: 200.0  # Remove transients to ensure trajectory is on attractor
  prediction_horizon: 0.2
  input_inds: [0,1,2,4,5,6,8,9,10,12,13,14,16,17,18,20,21,22,24,25,26,28,29,30,32,33,34,36,37,38]
  output_inds: [0,1,2,4,5,6,8,9,10,12,13,14,16,17,18,20,21,22,24,25,26,28,29,30,32,33,34,36,37,38]
  n_trajectories_train: 160000
  n_trajectories_val: 2000
  n_trajectories_test: 2000
  params:
    state_dim: 40
    forcing: 8.0
    # Initial condition ranges: [min_deviation, max_deviation] from forcing
    init_ranges: [-1, 1]

# Model parameters
model:
  d_model: 1024
  nhead: 8
  num_layers: 6
  dim_feedforward: 1024
  dropout: 0.0
  activation: 'gelu'
  use_positional_encoding: false
  append_position_to_x: true
  pos_enc_coeff: 2
  domain_dim: 1
  plot_inds: [0, 1]  # Output dimensions to plot

# Training parameters
training:
  batch_size: 64
  learning_rate: 0.0001
  max_epochs: 1000
  max_time: "00:10:45:00"  # Training time limit (DD:HH:MM:SS) used for the paper runs
  monitor_metric: 'loss/val/rel_L2'
  lr_scheduler_params:
    patience: 2
    factor: 0.5
  gradient_clip_val: 10.0
  log_every_n_steps: 10
  loss_name: 'l2_rel'

# Experiment settings
experiment:
  project_name: 'L96_Forecasting'
  seed: 42

evaluation:
  checkpoint_path: null  # Set here or pass --checkpoint
  system_name: 'L96'
  n_examples: 4  # Number of example plots to generate
  save_plots: true
  seed: 4

# Data generation (scripts/generate_data.py); results can differ slightly between batch sizes
data_generation:
  batch_size: 1000
